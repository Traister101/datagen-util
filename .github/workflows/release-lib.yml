name: Publish Lib

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_number: "${{ steps.version_number.outputs.result }}"
      version_type: "${{ steps.version_type.outputs.result }}"
    steps:
      - name: Get Version
        id: version_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let ref = '${{ github.ref }}';
            return ref.startsWith('refs/tags/v') ? ref.replace('refs/tags/v', '') : 'indev';

      - name: Get Version Type
        id: version_type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let version = '${{ steps.version.outputs.result }}';
            return version.includes('alpha') ? 'alpha' : (version.includes('beta') ? 'beta' : 'release');
  main:
    needs: [ version ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version_number }}
      VERSION_TYPE: ${{ needs.version.outputs.version_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      - name: Publish
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UP_MAVEN_USER: ${{ secrets.UP_MAVEN_USER }}
          UP_MAVEN_TOKEN: ${{ secrets.UP_MAVEN_TOKEN }}